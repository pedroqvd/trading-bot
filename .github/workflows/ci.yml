name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Exclude live-trading blockchain packages (py-clob-client / eth-account / web3).
        # They are never imported during tests (conditional import inside methods)
        # and their pinned versions conflict with each other on fresh resolves.
        run: |
          grep -v -E '^\s*(py-clob-client|eth-account|web3)' requirements.txt \
            | pip install -r /dev/stdin

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: "staging"
          DRY_RUN: "true"
          POLYMARKET_PRIVATE_KEY: ""
          POLYMARKET_API_KEY: ""
          POLYMARKET_API_SECRET: ""
          POLYMARKET_API_PASSPHRASE: ""
        run: pytest tests/ -v --tb=short

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check app/ backtest/ tests/ --select E,F,W --ignore E501,F401
